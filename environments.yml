# Environment definitions for the sample repository.
# These mirror the promotion flow: master -> psup -> prod.
version: 1.0.0

environments:
  qa:
    branch: master
    api_base_url: https://qa.billing.internal
    debug: true
  psup:
    branch: psup
    api_base_url: https://psup.billing.internal
    debug: false
  prod:
    branch: prod
    api_base_url: https://billing.internal
    debug: false
