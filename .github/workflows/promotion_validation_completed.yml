name: Promotion validation completion continuation

on:
  workflow_run:
    workflows: [Promotion deployment validation]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  record-rejection:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted promotion automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Record rejected validation
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_AUTOMATION_TOKEN }}
          PROMOTION_LIFECYCLE_HMAC_KEY: ${{ secrets.PROMOTION_LIFECYCLE_HMAC_KEY }}
        run: python -m promotion.lifecycle validation-completed
