name: Promotion validation completion

on:
  workflow_call:
    inputs:
      promotion_id:
        required: true
        type: string
      initial_pr_number:
        required: true
        type: string
      deployment_target:
        required: true
        type: string
      release_branch:
        required: true
        type: string
      deployed_sha:
        required: true
        type: string
      validation_result:
        required: true
        type: string
    outputs:
      final_pr_number:
        value: ${{ jobs.publish-result.outputs.final_pr_number }}
      final_pr_url:
        value: ${{ jobs.publish-result.outputs.final_pr_url }}
      final_merge_sha:
        value: ${{ jobs.publish-result.outputs.final_merge_sha }}
      final_result:
        value: ${{ jobs.publish-result.outputs.final_result }}
      rollback_required:
        value: ${{ jobs.publish-result.outputs.rollback_required }}
      rollback_target:
        value: ${{ jobs.publish-result.outputs.rollback_target }}
      rollback_branch:
        value: ${{ jobs.publish-result.outputs.rollback_branch }}
      rollback_sha:
        value: ${{ jobs.publish-result.outputs.rollback_sha }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  wait-for-final-pr:
    if: inputs.validation_result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      final_pr_number: ${{ steps.poll.outputs.final_pr_number }}
      final_pr_url: ${{ steps.poll.outputs.final_pr_url }}
      final_merge_sha: ${{ steps.poll.outputs.final_merge_sha }}
      final_result: ${{ steps.poll.outputs.final_result }}
    steps:
      - name: Check out trusted promotion automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - id: poll
        name: Create, request normal auto-merge, and wait for final PR
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          PROMOTION_LIFECYCLE_HMAC_KEY: ${{ secrets.PROMOTION_LIFECYCLE_HMAC_KEY }}
        run: |
          deadline=$(( $(date +%s) + 5 * 3600 ))
          while true; do
            set +e
            python -m promotion.lifecycle final-pr-progress \
              --promotion-id "${{ inputs.promotion_id }}" \
              --initial-pr-number "${{ inputs.initial_pr_number }}" \
              --deployment-target "${{ inputs.deployment_target }}" \
              --release-branch "${{ inputs.release_branch }}" \
              --deployed-sha "${{ inputs.deployed_sha }}"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$status" -ne 3 ]]; then
              exit "$status"
            fi
            if (( $(date +%s) >= deadline )); then
              echo "::error::Final Pull Request was not merged within the supported five-hour wait window."
              exit 1
            fi
            sleep 60
          done

  record-rejected-validation:
    if: inputs.validation_result != 'success'
    runs-on: ubuntu-latest
    outputs:
      final_result: ${{ steps.reject.outputs.final_result }}
      rollback_required: ${{ steps.reject.outputs.rollback_required }}
      rollback_branch: ${{ steps.reject.outputs.rollback_branch }}
      rollback_sha: ${{ steps.reject.outputs.rollback_sha }}
    steps:
      - name: Check out trusted promotion automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - id: reject
        name: Record rejected validation and plan rollback
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          PROMOTION_LIFECYCLE_HMAC_KEY: ${{ secrets.PROMOTION_LIFECYCLE_HMAC_KEY }}
        run: |
          python -m promotion.lifecycle validation-failed \
            --promotion-id "${{ inputs.promotion_id }}" \
            --initial-pr-number "${{ inputs.initial_pr_number }}" \
            --deployment-target "${{ inputs.deployment_target }}" \
            --release-branch "${{ inputs.release_branch }}" \
            --deployed-sha "${{ inputs.deployed_sha }}" \
            --validation-result "${{ inputs.validation_result }}" \
            --repo-root .

  publish-result:
    if: always()
    needs: [wait-for-final-pr, record-rejected-validation]
    runs-on: ubuntu-latest
    outputs:
      final_pr_number: ${{ steps.publish.outputs.final_pr_number }}
      final_pr_url: ${{ steps.publish.outputs.final_pr_url }}
      final_merge_sha: ${{ steps.publish.outputs.final_merge_sha }}
      final_result: ${{ steps.publish.outputs.final_result }}
      rollback_required: ${{ steps.publish.outputs.rollback_required }}
      rollback_target: ${{ steps.publish.outputs.rollback_target }}
      rollback_branch: ${{ steps.publish.outputs.rollback_branch }}
      rollback_sha: ${{ steps.publish.outputs.rollback_sha }}
    steps:
      - id: publish
        env:
          VALIDATION_RESULT: ${{ inputs.validation_result }}
          FINAL_JOB_RESULT: ${{ needs.wait-for-final-pr.result }}
          REJECTION_JOB_RESULT: ${{ needs.record-rejected-validation.result }}
          FINAL_PR_NUMBER: ${{ needs.wait-for-final-pr.outputs.final_pr_number }}
          FINAL_PR_URL: ${{ needs.wait-for-final-pr.outputs.final_pr_url }}
          FINAL_MERGE_SHA: ${{ needs.wait-for-final-pr.outputs.final_merge_sha }}
          FINAL_RESULT: ${{ needs.wait-for-final-pr.outputs.final_result }}
          REJECTION_RESULT: ${{ needs.record-rejected-validation.outputs.final_result }}
          ROLLBACK_REQUIRED: ${{ needs.record-rejected-validation.outputs.rollback_required }}
          ROLLBACK_BRANCH: ${{ needs.record-rejected-validation.outputs.rollback_branch }}
          ROLLBACK_SHA: ${{ needs.record-rejected-validation.outputs.rollback_sha }}
          TARGET: ${{ inputs.deployment_target }}
        run: |
          if [[ "$VALIDATION_RESULT" == "success" && "$FINAL_JOB_RESULT" == "success" ]]; then
            {
              echo "final_pr_number=$FINAL_PR_NUMBER"
              echo "final_pr_url=$FINAL_PR_URL"
              echo "final_merge_sha=$FINAL_MERGE_SHA"
              echo "final_result=$FINAL_RESULT"
              echo "rollback_required=false"
              echo "rollback_target="
              echo "rollback_branch="
              echo "rollback_sha="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$VALIDATION_RESULT" != "success" && "$REJECTION_JOB_RESULT" == "success" ]]; then
            {
              echo "final_pr_number="
              echo "final_pr_url="
              echo "final_merge_sha="
              echo "final_result=$REJECTION_RESULT"
              echo "rollback_required=$ROLLBACK_REQUIRED"
              echo "rollback_target=$TARGET"
              echo "rollback_branch=$ROLLBACK_BRANCH"
              echo "rollback_sha=$ROLLBACK_SHA"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Validation result could not be finalized safely."
          exit 1
