name: Promotion deployment completion continuation

on:
  workflow_run:
    workflows: [Trigger DBX WF Management]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: promotion-deployment-completed-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  handle-deployment-result:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted promotion automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Record deployment result and request validation
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_AUTOMATION_TOKEN }}
          PROMOTION_LIFECYCLE_HMAC_KEY: ${{ secrets.PROMOTION_LIFECYCLE_HMAC_KEY }}
        run: python -m promotion.lifecycle deployment-completed
