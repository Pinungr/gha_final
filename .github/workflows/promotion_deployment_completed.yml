name: Promotion deployment verification

on:
  workflow_call:
    inputs:
      promotion_id:
        required: true
        type: string
      initial_pr_number:
        required: true
        type: string
      deployment_target:
        required: true
        type: string
      deployment_branch:
        required: true
        type: string
      expected_deployment_sha:
        required: true
        type: string
      actual_deployment_result:
        required: true
        type: string
      actual_deployed_sha:
        required: true
        type: string
    outputs:
      deployment_verified:
        value: ${{ jobs.verify.outputs.deployment_verified }}
      requires_validation:
        value: ${{ jobs.verify.outputs.requires_validation }}
      validation_environment:
        value: ${{ jobs.verify.outputs.validation_environment }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      deployment_verified: ${{ steps.verify.outputs.deployment_verified }}
      requires_validation: ${{ steps.verify.outputs.requires_validation }}
      validation_environment: ${{ steps.verify.outputs.validation_environment }}
    steps:
      - name: Check out trusted promotion automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - id: verify
        name: Verify direct deployment result
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          python -m promotion.lifecycle record-deployment-completed \
            --promotion-id "${{ inputs.promotion_id }}" \
            --initial-pr-number "${{ inputs.initial_pr_number }}" \
            --deployment-target "${{ inputs.deployment_target }}" \
            --deployment-branch "${{ inputs.deployment_branch }}" \
            --expected-deployment-sha "${{ inputs.expected_deployment_sha }}" \
            --actual-deployment-result "${{ inputs.actual_deployment_result }}" \
            --actual-deployed-sha "${{ inputs.actual_deployed_sha }}" \
            --repo-root .
