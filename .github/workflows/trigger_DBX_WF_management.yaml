name: Trigger DBX WF Management

# Personal-repository test stub. This workflow intentionally performs no DBX,
# ServiceNow, or organization-level operation. The production-ready version is
# maintained in office_workflow_templates/trigger_DBX_WF_management.yaml.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select test environment"
        required: true
        type: choice
        options: [none, MASTER, PSUP, PROD]
      action:
        description: "Test deployment action"
        required: true
        type: choice
        options: [none, create/update_repo, create/update_workflow, delete_workflow, create/update_and_trigger_workflow, trigger_workflow]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        required: true
        type: string
      promotion_id:
        required: false
        type: string
      initial_pr_number:
        required: false
        type: string
      deployment_branch:
        required: false
        type: string
      deployment_sha:
        required: false
        type: string
    outputs:
      deployment_result:
        description: Always successful in the personal-repository test stub
        value: ${{ jobs.test-deployment.outputs.deployment_result }}
      deployed_sha:
        description: SHA passed through by the parent workflow
        value: ${{ jobs.test-deployment.outputs.deployed_sha }}
      deployment_branch:
        description: Branch passed through by the parent workflow
        value: ${{ jobs.test-deployment.outputs.deployment_branch }}

run-name: Test DBX ${{ inputs.environment }} / ${{ inputs.action }} on ${{ github.ref }}

concurrency:
  group: dbx-deployment-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-deployment:
    name: Successful DBX test no-op
    runs-on: ubuntu-latest
    outputs:
      deployment_result: ${{ steps.result.outputs.deployment_result }}
      deployed_sha: ${{ steps.result.outputs.deployed_sha }}
      deployment_branch: ${{ steps.result.outputs.deployment_branch }}
    steps:
      - id: result
        name: Return successful test result
        env:
          TEST_ENVIRONMENT: ${{ inputs.environment }}
          TEST_ACTION: ${{ inputs.action }}
          PROMOTION_ID: ${{ inputs.promotion_id }}
          INITIAL_PR_NUMBER: ${{ inputs.initial_pr_number }}
          DEPLOYMENT_BRANCH: ${{ inputs.deployment_branch }}
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
        run: |
          {
            echo "## Personal repository DBX test stub"
            echo ""
            echo "No DBX, ServiceNow, or organization resource was changed."
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`$TEST_ENVIRONMENT\` |"
            echo "| Action | \`$TEST_ACTION\` |"
            echo "| Promotion ID | \`${PROMOTION_ID:-manual}\` |"
            echo "| Initial PR | \`${INITIAL_PR_NUMBER:-not supplied}\` |"
            echo "| Deployment branch | \`${DEPLOYMENT_BRANCH:-not supplied}\` |"
            echo "| Deployment SHA | \`${DEPLOYMENT_SHA:-not supplied}\` |"
            echo "| Result | \`success\` (test no-op) |"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "deployment_result=success"
            echo "deployed_sha=$DEPLOYMENT_SHA"
            echo "deployment_branch=$DEPLOYMENT_BRANCH"
          } >> "$GITHUB_OUTPUT"
