name: Promotion PR approval continuation

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: promotion-initial-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  approve-and-merge:
    # The Python handler additionally verifies the signed managed marker,
    # reviewer state, expected branches, and GitHub's merge eligibility.
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted promotion automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify approval and request protected merge
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          PROMOTION_LIFECYCLE_HMAC_KEY: ${{ secrets.PROMOTION_LIFECYCLE_HMAC_KEY }}
        run: python -m promotion.lifecycle initial-approval
