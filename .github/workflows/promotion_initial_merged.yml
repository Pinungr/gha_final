name: Promotion initial merge verification

on:
  workflow_call:
    inputs:
      promotion_id:
        required: true
        type: string
      initial_pr_number:
        required: true
        type: string
      merged_sha:
        required: true
        type: string
      deployment_branch:
        required: true
        type: string
      deployment_target:
        required: true
        type: string
      deployment_action:
        required: true
        type: string
    outputs:
      deployment_branch:
        value: ${{ jobs.verify-merge.outputs.deployment_branch }}
      deployment_sha:
        value: ${{ jobs.verify-merge.outputs.deployment_sha }}
      deployment_target:
        value: ${{ jobs.verify-merge.outputs.deployment_target }}
      deployment_action:
        value: ${{ jobs.verify-merge.outputs.deployment_action }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify-merge:
    runs-on: ubuntu-latest
    outputs:
      deployment_branch: ${{ steps.verify.outputs.deployment_branch }}
      deployment_sha: ${{ steps.verify.outputs.deployment_sha }}
      deployment_target: ${{ steps.verify.outputs.deployment_target }}
      deployment_action: ${{ steps.verify.outputs.deployment_action }}
    steps:
      - name: Check out trusted promotion automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - id: verify
        name: Verify the authenticated initial merge
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          PROMOTION_LIFECYCLE_HMAC_KEY: ${{ secrets.PROMOTION_LIFECYCLE_HMAC_KEY }}
        run: |
          python -m promotion.lifecycle verify-initial-merge \
            --promotion-id "${{ inputs.promotion_id }}" \
            --initial-pr-number "${{ inputs.initial_pr_number }}" \
            --merged-sha "${{ inputs.merged_sha }}" \
            --deployment-branch "${{ inputs.deployment_branch }}" \
            --deployment-target "${{ inputs.deployment_target }}" \
            --deployment-action "${{ inputs.deployment_action }}"
