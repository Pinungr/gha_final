name: Promotion initial merge continuation

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: promotion-initial-merged-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch-deployment:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted promotion automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Continue managed promotion after merge
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          PROMOTION_LIFECYCLE_HMAC_KEY: ${{ secrets.PROMOTION_LIFECYCLE_HMAC_KEY }}
        run: python -m promotion.lifecycle pr-closed
