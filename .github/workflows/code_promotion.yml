name: code_promotion

# Controlled promotion between environments. QA -> PSUP -> PROD. Operators
# create a temporary branch and commit its root promotion.txt inventory before
# dispatching this workflow. The automation updates that branch, creates a
# generated release/* branch from the target, and opens a Pull Request.
#
# Only users with write access to the repository can dispatch a workflow, which
# is the authorization gate for this pipeline. See docs/INSTALL.md for an
# optional environment-based approval gate on top of that.

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Promotion target"
        required: true
        type: choice
        options:
          - PSUP
          - PROD
      staging_branch:
        description: "User-created temporary branch containing root promotion.txt"
        required: true
        type: string
      release_description:
        description: "Optional description for the Pull Request"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

# Two runs against the same temporary branch must not race for its baseline HEAD.
concurrency:
  group: code-promotion-${{ inputs.deployment_target }}-${{ inputs.staging_branch }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote to ${{ inputs.deployment_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # Pinned to a full-length commit SHA: this repository requires it.
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Start on the user-selected temporary branch. The promotion also reads
          # source blobs and validates remote branch tips.
          ref: ${{ inputs.staging_branch }}
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare promotion and open Pull Request
        id: promote
        env:
          INPUT_DEPLOYMENT_TARGET: ${{ inputs.deployment_target }}
          INPUT_STAGING_BRANCH: ${{ inputs.staging_branch }}
          INPUT_RELEASE_DESCRIPTION: ${{ inputs.release_description }}
          GH_TOKEN: ${{ github.token }}
        run: python -m promotion

      - name: Report result
        if: success()
        run: |
          echo "Temporary branch : ${{ steps.promote.outputs.temporary_branch }}"
          echo "Release branch   : ${{ steps.promote.outputs.release_branch }}"
          echo "Pull Request     : ${{ steps.promote.outputs.pr_url }}"
