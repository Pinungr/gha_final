name: Code Promotion DBX Management

# Personal-repository automation adapter. It mirrors the reusable interface of
# the office implementation but intentionally changes no external resources.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        required: true
        type: string
      promotion_id:
        required: true
        type: string
      initial_pr_number:
        required: true
        type: string
      deployment_branch:
        required: true
        type: string
      deployment_sha:
        required: true
        type: string
    outputs:
      deployment_result:
        value: ${{ jobs.test-deployment.outputs.deployment_result }}
      deployed_sha:
        value: ${{ jobs.test-deployment.outputs.deployed_sha }}
      deployment_branch:
        value: ${{ jobs.test-deployment.outputs.deployment_branch }}

concurrency:
  group: dbx-deployment-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-deployment:
    name: Successful Code Promotion DBX test no-op
    runs-on: ubuntu-latest
    outputs:
      deployment_result: ${{ steps.result.outputs.deployment_result }}
      deployed_sha: ${{ steps.result.outputs.deployed_sha }}
      deployment_branch: ${{ steps.result.outputs.deployment_branch }}
    steps:
      - id: result
        name: Return successful test result
        env:
          TEST_ENVIRONMENT: ${{ inputs.environment }}
          TEST_ACTION: ${{ inputs.action }}
          PROMOTION_ID: ${{ inputs.promotion_id }}
          INITIAL_PR_NUMBER: ${{ inputs.initial_pr_number }}
          DEPLOYMENT_BRANCH: ${{ inputs.deployment_branch }}
          DEPLOYMENT_SHA: ${{ inputs.deployment_sha }}
        run: |
          {
            echo "## Personal repository Code Promotion DBX adapter"
            echo ""
            echo "No DBX, ServiceNow, or organization resource was changed."
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Environment | \`$TEST_ENVIRONMENT\` |"
            echo "| Action | \`$TEST_ACTION\` |"
            echo "| Promotion ID | \`$PROMOTION_ID\` |"
            echo "| Initial PR | \`$INITIAL_PR_NUMBER\` |"
            echo "| Deployment branch | \`$DEPLOYMENT_BRANCH\` |"
            echo "| Deployment SHA | \`$DEPLOYMENT_SHA\` |"
            echo "| Result | \`success\` (test no-op) |"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "deployment_result=success"
            echo "deployed_sha=$DEPLOYMENT_SHA"
            echo "deployment_branch=$DEPLOYMENT_BRANCH"
          } >> "$GITHUB_OUTPUT"
