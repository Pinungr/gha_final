name: Promotion deployment validation

on:
  workflow_call:
    inputs:
      promotion_id:
        required: true
        type: string
      initial_pr_number:
        required: true
        type: string
      deployment_target:
        required: true
        type: string
      deployment_branch:
        required: true
        type: string
      deployed_sha:
        required: true
        type: string
      validation_environment:
        required: true
        type: string
    outputs:
      validation_result:
        value: ${{ jobs.await-approval.outputs.validation_result }}
      validated_sha:
        value: ${{ jobs.await-approval.outputs.validated_sha }}

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: promotion-validation-${{ inputs.promotion_id }}
  cancel-in-progress: false

jobs:
  request-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted promotion automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Record post-deployment validation request
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          PROMOTION_LIFECYCLE_HMAC_KEY: ${{ secrets.PROMOTION_LIFECYCLE_HMAC_KEY }}
        run: |
          python -m promotion.lifecycle validation-started \
            --promotion-id "${{ inputs.promotion_id }}" \
            --initial-pr-number "${{ inputs.initial_pr_number }}" \
            --deployment-target "${{ inputs.deployment_target }}" \
            --deployment-branch "${{ inputs.deployment_branch }}" \
            --deployed-sha "${{ inputs.deployed_sha }}" \
            --validation-environment "${{ inputs.validation_environment }}" \
            --repo-root .
      - name: Write validation summary
        run: |
          {
            echo "## Post-deployment validation requested"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Promotion ID | \`${{ inputs.promotion_id }}\` |"
            echo "| Target | \`${{ inputs.deployment_target }}\` |"
            echo "| Deployed SHA | \`${{ inputs.deployed_sha }}\` |"
            echo "| Environment | \`${{ inputs.validation_environment }}\` |"
            echo "| Protection rules | Configured required reviewer and wait timer |"
          } >> "$GITHUB_STEP_SUMMARY"

  await-approval:
    needs: request-validation
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.validation_environment }}
    outputs:
      validation_result: ${{ steps.approve.outputs.validation_result }}
      validated_sha: ${{ steps.approve.outputs.validated_sha }}
    steps:
      - name: Check out trusted promotion automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - id: approve
        name: Verify approved environment validation
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          PROMOTION_LIFECYCLE_HMAC_KEY: ${{ secrets.PROMOTION_LIFECYCLE_HMAC_KEY }}
        run: |
          python -m promotion.lifecycle validation-approved \
            --promotion-id "${{ inputs.promotion_id }}" \
            --initial-pr-number "${{ inputs.initial_pr_number }}" \
            --deployment-target "${{ inputs.deployment_target }}" \
            --deployment-branch "${{ inputs.deployment_branch }}" \
            --deployed-sha "${{ inputs.deployed_sha }}"
