name: Promotion initial Pull Request approval

on:
  workflow_call:
    inputs:
      promotion_id:
        required: true
        type: string
      initial_pr_number:
        required: true
        type: string
      staging_branch:
        required: true
        type: string
      initial_pr_base:
        required: true
        type: string
      approval_timeout_hours:
        required: true
        type: number
    outputs:
      merged_sha:
        value: ${{ jobs.wait-for-merge.outputs.merged_sha }}
      merged_branch:
        value: ${{ jobs.wait-for-merge.outputs.merged_branch }}
      approval_result:
        value: ${{ jobs.wait-for-merge.outputs.approval_result }}

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: promotion-initial-${{ inputs.initial_pr_number }}
  cancel-in-progress: false

jobs:
  wait-for-merge:
    runs-on: self-hosted
    # Enterprise self-hosted runners may wait longer, but five hours keeps the
    # same bounded approval contract as the public workflow.
    timeout-minutes: 360
    outputs:
      merged_sha: ${{ steps.poll.outputs.merged_sha }}
      merged_branch: ${{ steps.poll.outputs.merged_branch }}
      approval_result: ${{ steps.poll.outputs.approval_result }}
    steps:
      - name: Check out trusted master from internal GitHub
        working-directory: ${{ github.workspace }}
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git init
          git remote add origin "https://${REPO_TOKEN}@github.kp.org/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin master
          git checkout --force -B master FETCH_HEAD
      - name: Verify Org Python
        run: python --version
      - name: Explain merge wait
        run: |
          echo "## Manual initial Pull Request approval required" >> "$GITHUB_STEP_SUMMARY"
          echo "Review and manually squash-merge [PR #${{ inputs.initial_pr_number }}](${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.initial_pr_number }}). The PR author may merge it when repository rules permit." >> "$GITHUB_STEP_SUMMARY"
      - id: poll
        name: Wait for mandatory manual merge
        env:
          GH_HOST: github.kp.org
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.REPO_TOKEN }}
          APPROVAL_TIMEOUT_HOURS: ${{ inputs.approval_timeout_hours }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if ! [[ "$APPROVAL_TIMEOUT_HOURS" =~ ^[1-5]$ ]]; then
            echo "::error::approval_timeout_hours must be between 1 and 5 on the current hosted-runner contract."
            exit 1
          fi
          deadline=$(( $(date +%s) + APPROVAL_TIMEOUT_HOURS * 3600 ))
          while true; do
            set +e
            python -m promotion.lifecycle initial-pr-progress \
              --promotion-id "${{ inputs.promotion_id }}" \
              --initial-pr-number "${{ inputs.initial_pr_number }}" \
              --staging-branch "${{ inputs.staging_branch }}" \
              --initial-pr-base "${{ inputs.initial_pr_base }}"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then exit 0; fi
            if [[ "$status" -ne 3 ]]; then exit "$status"; fi
            if (( $(date +%s) >= deadline )); then
              echo "::error::Initial Pull Request was not merged within ${APPROVAL_TIMEOUT_HOURS} hour(s)."
              exit 1
            fi
            sleep 60
          done
      - name: Remove Git credential
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: git remote set-url origin "https://github.kp.org/${GITHUB_REPOSITORY}.git" || true
