name: Promotion initial merge verification

on:
  workflow_call:
    inputs:
      promotion_id:
        required: true
        type: string
      initial_pr_number:
        required: true
        type: string
      merged_sha:
        required: true
        type: string
      deployment_branch:
        required: true
        type: string
      deployment_target:
        required: true
        type: string
    outputs:
      deployment_branch:
        value: ${{ jobs.verify-merge.outputs.deployment_branch }}
      deployment_sha:
        value: ${{ jobs.verify-merge.outputs.deployment_sha }}
      deployment_target:
        value: ${{ jobs.verify-merge.outputs.deployment_target }}
      deployment_action:
        value: ${{ jobs.verify-merge.outputs.deployment_action }}

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify-merge:
    runs-on: self-hosted
    outputs:
      deployment_branch: ${{ steps.verify.outputs.deployment_branch }}
      deployment_sha: ${{ steps.verify.outputs.deployment_sha }}
      deployment_target: ${{ steps.verify.outputs.deployment_target }}
      deployment_action: ${{ steps.verify.outputs.deployment_action }}
    steps:
      - name: Check out trusted master from internal GitHub
        working-directory: ${{ github.workspace }}
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git init
          git remote add origin "https://${REPO_TOKEN}@github.kp.org/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin master
          git checkout --force -B master FETCH_HEAD
      - name: Verify Org Python
        run: python --version
      - id: verify
        name: Verify the final merged Pull Request
        env:
          GH_HOST: github.kp.org
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.REPO_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m promotion.lifecycle verify-initial-merge \
            --promotion-id "${{ inputs.promotion_id }}" \
            --initial-pr-number "${{ inputs.initial_pr_number }}" \
            --merged-sha "${{ inputs.merged_sha }}" \
            --deployment-branch "${{ inputs.deployment_branch }}" \
            --deployment-target "${{ inputs.deployment_target }}" \
            --repo-root .
      - name: Remove Git credential
        if: always()
        run: git remote set-url origin "https://github.kp.org/${GITHUB_REPOSITORY}.git" || true
