name: Trigger DBX WF Management

run-name: "DBX deployment: ${{ inputs.promotion_id || format('manual-{0}', github.run_id) }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options: [MASTER, PSUP, PROD]
      deployment_action:
        description: Deployment Action
        required: true
        type: choice
        options: [create/update_repo, none, create/update_workflow, delete_workflow, create/update_and_trigger_workflow, trigger_workflow]
      promotion_id:
        description: Promotion ID (set automatically; leave blank for a manual run)
        required: false
        type: string
      initial_pr_number:
        description: Initial promotion PR number (set automatically)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dbx-deployment-${{ inputs.promotion_id || github.run_id }}
  cancel-in-progress: false

jobs:
  context:
    name: Deployment context
    runs-on: self-hosted
    outputs:
      branch: ${{ steps.context.outputs.branch }}
    steps:
      - id: context
        name: Record dummy deployment context
        run: |
          echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          {
            echo "## DBX deployment requested"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Promotion ID | \`${{ inputs.promotion_id || format('manual-{0}', github.run_id) }}\` |"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Deployment action | \`${{ inputs.deployment_action }}\` |"
            echo "| Status | Successful dummy no-op |"
          } >> "$GITHUB_STEP_SUMMARY"

  create_or_update_repo:
    if: inputs.deployment_action == 'create/update_repo'
    needs: context
    runs-on: self-hosted
    steps:
      - name: Dummy create/update_repo
        run: 'echo "Dummy deployment: create/update_repo performs no action." >> "$GITHUB_STEP_SUMMARY"'

  create_or_update_workflow:
    if: inputs.deployment_action == 'create/update_workflow'
    needs: context
    runs-on: self-hosted
    steps:
      - name: Dummy create/update_workflow
        run: 'echo "Dummy deployment: create/update_workflow performs no action." >> "$GITHUB_STEP_SUMMARY"'

  delete_workflow:
    if: inputs.deployment_action == 'delete_workflow'
    needs: context
    runs-on: self-hosted
    steps:
      - name: Dummy delete_workflow
        run: 'echo "Dummy deployment: delete_workflow performs no action." >> "$GITHUB_STEP_SUMMARY"'

  create_update_and_trigger_workflow:
    if: inputs.deployment_action == 'create/update_and_trigger_workflow'
    needs: context
    runs-on: self-hosted
    steps:
      - name: Dummy create/update_and_trigger_workflow
        run: 'echo "Dummy deployment: create/update_and_trigger_workflow performs no action." >> "$GITHUB_STEP_SUMMARY"'

  trigger_workflow:
    if: inputs.deployment_action == 'trigger_workflow'
    needs: context
    runs-on: self-hosted
    steps:
      - name: Dummy trigger_workflow
        run: 'echo "Dummy deployment: trigger_workflow performs no action." >> "$GITHUB_STEP_SUMMARY"'

  no_operation:
    if: inputs.deployment_action == 'none'
    needs: context
    runs-on: self-hosted
    steps:
      - name: Record no-op deployment
        run: echo "No deployment action was requested." >> "$GITHUB_STEP_SUMMARY"
