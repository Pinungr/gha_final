name: Trigger DBX WF Management

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      deployment_action:
        required: true
        type: string
      promotion_id:
        required: true
        type: string
      initial_pr_number:
        required: true
        type: string
      deployment_branch:
        required: true
        type: string
      deployment_sha:
        required: true
        type: string
    outputs:
      deployment_result:
        value: ${{ jobs.report.outputs.deployment_result }}
      deployed_sha:
        value: ${{ jobs.report.outputs.deployed_sha }}
      deployment_branch:
        value: ${{ jobs.report.outputs.deployment_branch }}

permissions:
  contents: read

concurrency:
  group: dbx-deployment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  context:
    name: Verify deployment context
    runs-on: self-hosted
    outputs:
      deployment_branch: ${{ steps.verify.outputs.deployment_branch }}
      deployment_sha: ${{ steps.verify.outputs.deployed_sha }}
    steps:
      - name: Check out trusted master from internal GitHub
        working-directory: ${{ github.workspace }}
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git init
          git remote add origin "https://${REPO_TOKEN}@github.kp.org/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin master
          git checkout --force -B master FETCH_HEAD
      - name: Verify Org Python
        run: python --version
      - id: verify
        name: Verify exact deployment branch and SHA
        env:
          GH_HOST: github.kp.org
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          GH_ENTERPRISE_TOKEN: ${{ secrets.REPO_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m promotion.lifecycle verify-deployment-branch \
            --deployment-branch "${{ inputs.deployment_branch }}" \
            --deployment-sha "${{ inputs.deployment_sha }}"
      - name: Write deployment summary
        run: |
          {
            echo "## DBX deployment requested"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Promotion ID | \`${{ inputs.promotion_id }}\` |"
            echo "| Environment | \`${{ inputs.environment }}\` |"
            echo "| Branch | \`${{ inputs.deployment_branch }}\` |"
            echo "| SHA | \`${{ inputs.deployment_sha }}\` |"
            echo "| Deployment action | \`${{ inputs.deployment_action }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove Git credential
        if: always()
        run: git remote set-url origin "https://github.kp.org/${GITHUB_REPOSITORY}.git" || true

  create_or_update_repo:
    if: inputs.deployment_action == 'create/update_repo'
    needs: context
    runs-on: self-hosted
    steps:
      - run: 'echo "Dummy deployment: create/update_repo intentionally performs no action." >> "$GITHUB_STEP_SUMMARY"'

  create_or_update_workflow:
    if: inputs.deployment_action == 'create/update_workflow'
    needs: context
    runs-on: self-hosted
    steps:
      - run: 'echo "Dummy deployment: create/update_workflow intentionally performs no action." >> "$GITHUB_STEP_SUMMARY"'

  delete_workflow:
    if: inputs.deployment_action == 'delete_workflow'
    needs: context
    runs-on: self-hosted
    steps:
      - run: 'echo "Dummy deployment: delete_workflow intentionally performs no action." >> "$GITHUB_STEP_SUMMARY"'

  create_update_and_trigger_workflow:
    if: inputs.deployment_action == 'create/update_and_trigger_workflow'
    needs: context
    runs-on: self-hosted
    steps:
      - run: 'echo "Dummy deployment: create/update_and_trigger_workflow intentionally performs no action." >> "$GITHUB_STEP_SUMMARY"'

  trigger_workflow:
    if: inputs.deployment_action == 'trigger_workflow'
    needs: context
    runs-on: self-hosted
    steps:
      - run: 'echo "Dummy deployment: trigger_workflow intentionally performs no action." >> "$GITHUB_STEP_SUMMARY"'

  no_operation:
    if: inputs.deployment_action == 'none'
    needs: context
    runs-on: self-hosted
    steps:
      - run: echo "No deployment action was requested." >> "$GITHUB_STEP_SUMMARY"

  report:
    if: always()
    needs: [context, create_or_update_repo, create_or_update_workflow, delete_workflow, create_update_and_trigger_workflow, trigger_workflow, no_operation]
    runs-on: self-hosted
    outputs:
      deployment_result: ${{ steps.result.outputs.deployment_result }}
      deployed_sha: ${{ steps.result.outputs.deployed_sha }}
      deployment_branch: ${{ steps.result.outputs.deployment_branch }}
    steps:
      - id: result
        name: Return direct deployment result
        env:
          ACTION: ${{ inputs.deployment_action }}
          CONTEXT_RESULT: ${{ needs.context.result }}
          REPO_RESULT: ${{ needs.create_or_update_repo.result }}
          WORKFLOW_RESULT: ${{ needs.create_or_update_workflow.result }}
          DELETE_RESULT: ${{ needs.delete_workflow.result }}
          UPDATE_TRIGGER_RESULT: ${{ needs.create_update_and_trigger_workflow.result }}
          TRIGGER_RESULT: ${{ needs.trigger_workflow.result }}
          NONE_RESULT: ${{ needs.no_operation.result }}
        run: |
          case "$ACTION" in
            create/update_repo) selected="$REPO_RESULT" ;;
            create/update_workflow) selected="$WORKFLOW_RESULT" ;;
            delete_workflow) selected="$DELETE_RESULT" ;;
            create/update_and_trigger_workflow) selected="$UPDATE_TRIGGER_RESULT" ;;
            trigger_workflow) selected="$TRIGGER_RESULT" ;;
            none) selected="$NONE_RESULT" ;;
            *) echo "::error::Unsupported deployment action: $ACTION"; exit 1 ;;
          esac
          if [[ "$CONTEXT_RESULT" != "success" || "$selected" != "success" ]]; then
            echo "::error::Deployment did not complete successfully."
            exit 1
          fi
          {
            echo "deployment_result=success"
            echo "deployed_sha=${{ inputs.deployment_sha }}"
            echo "deployment_branch=${{ inputs.deployment_branch }}"
          } >> "$GITHUB_OUTPUT"
